<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="background:#05040a" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="50%" y="50%" fill="#fff" font-family="sans-serif" font-size="20" text-anchor="middle" id="t">Loading…</text>
  <script type="text/javascript"><![CDATA[
    var BASE = "https://cdn.statically.io/gh/Lego611091/Nebula-storage/main/";
    fetch(BASE + "index.html")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        html = html.replace(/<head[^>]*>/i, function (m) { return m + '<base href="' + BASE + '">'; });
        location.replace(URL.createObjectURL(new Blob([html], { type: "text/html" })));
      })
      .catch(function (e) { document.getElementById("t").textContent = "Failed to load: " + e; });
  ]]></script>
</svg>
